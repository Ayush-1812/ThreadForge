name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC 13 Debug
            cc: gcc-13
            cxx: g++-13
            compiler_packages: gcc-13 g++-13
            build_type: Debug
            sanitizer: none
            benchmarks: "OFF"
          - name: GCC 13 Release
            cc: gcc-13
            cxx: g++-13
            compiler_packages: gcc-13 g++-13
            build_type: Release
            sanitizer: none
            benchmarks: "ON"
          - name: Clang 18 Release
            cc: clang-18
            cxx: clang++-18
            compiler_packages: clang-18
            build_type: Release
            sanitizer: none
            benchmarks: "OFF"
          - name: GCC 13 ASan and UBSan
            cc: gcc-13
            cxx: g++-13
            compiler_packages: gcc-13 g++-13
            build_type: Debug
            sanitizer: address-undefined
            benchmarks: "OFF"
          - name: GCC 13 TSan
            cc: gcc-13
            cxx: g++-13
            compiler_packages: gcc-13 g++-13
            build_type: Debug
            sanitizer: thread
            benchmarks: "OFF"
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      TSAN_OPTIONS: halt_on_error=1
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        # Official actions/checkout v7.0.1; full SHA verified on its release page.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            cmake ninja-build libgtest-dev libbenchmark-dev python3 util-linux \
            ${{ matrix.compiler_packages }}

      - name: Configure
        run: |
          sanitizer_flags=()
          if [[ "${{ matrix.sanitizer }}" == "address-undefined" ]]; then
            sanitizer_flags=(-DTHREADFORGE_ENABLE_ASAN=ON -DTHREADFORGE_ENABLE_UBSAN=ON)
          elif [[ "${{ matrix.sanitizer }}" == "thread" ]]; then
            sanitizer_flags=(-DTHREADFORGE_ENABLE_TSAN=ON)
          fi
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DTHREADFORGE_WARNINGS_AS_ERRORS=ON \
            -DTHREADFORGE_BUILD_TESTS=ON -DTHREADFORGE_BUILD_STRESS_TESTS=ON \
            -DTHREADFORGE_BUILD_EXAMPLES=ON \
            -DTHREADFORGE_BUILD_BENCHMARKS=${{ matrix.benchmarks }} \
            "${sanitizer_flags[@]}"

      - name: Build
        run: cmake --build build --parallel 2

      - name: Run focused and stress tests
        if: matrix.sanitizer != 'thread'
        run: ctest --test-dir build --output-on-failure --parallel 1

      - name: Run ThreadSanitizer tests
        if: matrix.sanitizer == 'thread'
        run: |
          # Probe sanitizer startup before selecting a layout for the test suite.
          set +e
          ./build/threadforge_tests --gtest_list_tests > tsan-startup.log 2>&1
          startup_status=$?
          set -e
          cat tsan-startup.log
          if [[ $startup_status -eq 0 ]]; then
            ctest --test-dir build --output-on-failure --parallel 1
            exit "$?"
          fi
          mapping_diagnostic='^FATAL: ThreadSanitizer: unexpected memory mapping 0x[[:xdigit:]]+-0x[[:xdigit:]]+$'
          if ! grep -Eq "$mapping_diagnostic" tsan-startup.log; then
            exit "$startup_status"
          fi
          # Only a mapping-only startup failure permits the layout workaround.
          if grep -Eqv "$mapping_diagnostic|^[[:space:]]*$" tsan-startup.log; then
            exit "$startup_status"
          fi
          echo "::notice::TSan startup preflight found a mapping failure; selecting per-process setarch -R for CTest"
          # Run the suite once. Actual test failures are never retried.
          setarch "$(uname -m)" -R ctest --test-dir build --output-on-failure --parallel 1

      - name: Run examples
        if: matrix.sanitizer != 'thread'
        run: |
          ./build/threadforge_basic
          ./build/threadforge_work_stealing
          ./build/threadforge_priorities
          ./build/threadforge_dependency_graph
          ./build/threadforge_metrics_report

      - name: Check benchmark runner syntax
        if: matrix.benchmarks == 'ON'
        run: |
          bash -n scripts/run_benchmarks.sh

      - name: Run checksum benchmark smoke
        if: matrix.benchmarks == 'ON'
        run: |
          ./build/benchmarks/threadforge_benchmarks \
            --benchmark_filter='/rounds:1/manual_time$' \
            --benchmark_min_warmup_time=0.01 --benchmark_min_time=0.01s \
            --benchmark_repetitions=1 \
            --benchmark_out=build/benchmark-smoke.raw.json --benchmark_out_format=json
          # Google Benchmark's exit code alone does not reject checksum errors.
          python3 scripts/summarize_benchmarks.py build/benchmark-smoke.raw.json \
            --normalized-json build/benchmark-smoke.json > build/benchmark-smoke.md
          cat build/benchmark-smoke.md
          cat build/benchmark-smoke.md >> "$GITHUB_STEP_SUMMARY"
